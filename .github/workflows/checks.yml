# Repository sanity checks. This is a plain CI workflow — it does NOT build or
# deploy the site, so it leaves GitHub Pages on the zero-config `legacy` builder
# (see AGENTS.md). It only validates the repo on pull requests and pushes.
name: checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # index.md's Interactive list must match the StaticSites manifest and every
      # linked map must resolve; Jekyll silently ignores posts whose filename
      # isn't YYYY-MM-DD-title. Both live in the Makefile so `make check` locally
      # is exactly what CI runs.
      - name: StaticSites manifest is in sync
        run: make check-sync

      - name: Post filenames are Jekyll-valid
        run: make check-posts
