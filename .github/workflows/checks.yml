# Repository sanity checks. This is a plain CI workflow — it does NOT build or
# deploy the site, so it leaves GitHub Pages on the zero-config `legacy` builder
# (see AGENTS.md). It only validates the repo on pull requests and pushes.
name: checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # index.md's Interactive list must match the StaticSites manifest, and every
      # linked map must resolve. Fails if someone bumps the submodule without
      # regenerating (run: python3 scripts/sync_staticsites.py).
      - name: StaticSites manifest is in sync
        run: python3 scripts/sync_staticsites.py --check

      # Jekyll silently ignores posts whose filename isn't YYYY-MM-DD-title, so
      # guard against that whole class of "post never publishes" bug.
      - name: Post filenames are Jekyll-valid
        run: |
          bad=$(ls _posts | grep -vE '^[0-9]{4}-[0-9]{2}-[0-9]{2}-' || true)
          if [ -n "$bad" ]; then
            echo "::error::These _posts filenames don't match YYYY-MM-DD-title and won't publish:"
            echo "$bad"
            exit 1
          fi
