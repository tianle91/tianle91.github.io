---
layout: default
---
<article class="prose">
  <header class="page-heading">
    {% if page.collection == 'posts' %}<p class="eyebrow"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>{% endif %}
    <h1>{{ page.title }}</h1>
  </header>
  {{ content }}
</article>
